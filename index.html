<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Chat</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1c1e21;--muted:#65676b;--line:#e4e6eb;--primary:#0a7cff;--theirs:#e9ebee;--danger:#e0245e}
[data-theme="dark"]{--bg:#18191a;--panel:#242526;--text:#e4e6eb;--muted:#9a9da1;--line:#3a3b3c;--primary:#2d88ff;--theirs:#3a3b3c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--primary)}
.hidden{display:none!important}
.row{display:flex;gap:.5rem;align-items:center}.end{justify-content:flex-end}
.grow{flex:1;min-width:0}.pad{padding:.75rem}.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:.5rem}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:.5rem .9rem;border-radius:10px;cursor:pointer;font:inherit}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:.2rem .6rem;font-size:.85rem}
.icon{border:0;background:none;color:var(--text);font-size:1.15rem;cursor:pointer;padding:.35rem .5rem;border-radius:8px}
.icon:hover{background:var(--line)}
input{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.card{background:var(--panel);color:var(--text);padding:1.25rem;border-radius:14px;display:flex;flex-direction:column;gap:.7rem;min-width:min(92vw,380px)}
.card h1,.card h2,.card h3{margin:0}
.auth{min-height:100%;display:grid;place-items:center;padding:1rem}
.error{color:var(--danger);margin:0;min-height:1em}
dialog{border:0;padding:0;border-radius:14px;background:transparent}
dialog::backdrop{background:rgba(0,0,0,.5)}
hr{border:0;border-top:1px solid var(--line);width:100%}
.app{display:grid;grid-template-columns:340px 1fr;height:100dvh}
.sidebar{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head,.chat-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.group-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.group{display:flex;gap:.75rem;align-items:center;padding:.7rem 1rem;cursor:pointer}
.group:hover,.group.active{background:var(--bg)}
.group strong{display:block}
.group small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:.75rem;padding:.1rem .45rem}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.empty{margin:auto;color:var(--muted)}
.chat-inner{display:flex;flex-direction:column;height:100%;min-height:0}
.chat-head{background:var(--panel)}
.chat-head small{display:block;color:var(--muted)}
.back{display:none}
.messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.35rem}
.more{align-self:center}
.msg{display:flex;max-width:75%}
.msg.mine{margin-inline-start:auto}
.bubble{padding:.45rem .75rem;border-radius:16px;background:var(--theirs)}
.mine .bubble{background:var(--primary);color:#fff}
.who{font-size:.75rem;font-weight:700;color:var(--primary);margin-bottom:.1rem}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
.time{display:block;font-size:.68rem;opacity:.7;text-align:end;margin-top:.1rem}
.typing{height:1.3rem;padding:0 1rem;font-size:.8rem;color:var(--muted)}
.composer{display:flex;gap:.5rem;padding:.75rem;background:var(--panel);border-top:1px solid var(--line)}
.member-list{list-style:none;margin:0;padding:0}
.member{display:flex;align-items:center;gap:.6rem;padding:.35rem 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.dot.on{background:#31a24c}
.keybox{font:700 1.35rem ui-monospace,Consolas,monospace;letter-spacing:.08em;text-align:center;padding:.8rem;background:var(--bg);border-radius:10px;user-select:all}
.toast{position:fixed;inset-block-end:1rem;inset-inline:0;margin:auto;width:fit-content;max-width:90vw;background:#222;color:#fff;padding:.6rem 1rem;border-radius:10px;z-index:99}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .chat{display:none}
  .app.chat-open .sidebar{display:none}
  .app.chat-open .chat{display:flex}
  .back{display:inline-block}
  .msg{max-width:88%}
}
</style>
<script>
document.documentElement.dataset.theme = localStorage.getItem("theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dir = localStorage.getItem("dir") || "ltr";
</script>
</head>
<body>

<main class="auth" id="auth">
  <form class="card" id="form-auth">
    <h1 id="auth-title">Sign in</h1>
    <input name="u" placeholder="Username" required maxlength="20" autocomplete="username">
    <input name="p" type="password" placeholder="Password (min 6)" required minlength="6" autocomplete="current-password">
    <p class="error" id="auth-err"></p>
    <button class="btn primary" id="auth-btn">Sign in</button>
    <p class="muted"><a href="#" id="auth-toggle">Create an account</a></p>
  </form>
</main>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <header class="side-head">
      <strong id="me-name">Chats</strong>
      <div class="row">
        <button class="icon" id="btn-theme" title="Dark / light">◐</button>
        <button class="icon" id="btn-dir" title="LTR / RTL">⇄</button>
        <button class="icon" id="btn-logout" title="Log out">⏻</button>
      </div>
    </header>
    <div class="row pad">
      <button class="btn primary" id="btn-create">+ New group</button>
      <button class="btn" id="btn-join">Join with key</button>
    </div>
    <ul class="group-list" id="group-list"></ul>
  </aside>

  <section class="chat">
    <div class="empty" id="empty">Select or join a group to start chatting.</div>
    <div class="chat-inner hidden" id="chat-inner">
      <header class="chat-head">
        <button class="icon back" id="btn-back">←</button>
        <div class="grow"><strong id="chat-title"></strong><small id="chat-sub"></small></div>
        <button class="icon" id="btn-members" title="Members">👥</button>
      </header>
      <div class="messages" id="messages"></div>
      <div class="typing" id="typing"></div>
      <form class="composer" id="composer">
        <input id="msg-input" autocomplete="off" maxlength="2000" placeholder="Type a message…" dir="auto">
        <button class="btn primary">Send</button>
      </form>
    </div>
  </section>
</div>

<dialog id="dlg-create">
  <form class="card" id="form-create">
    <h2>New group</h2>
    <input name="name" placeholder="Group name" required maxlength="80">
    <input name="description" placeholder="Description (optional)" maxlength="300">
    <p class="error" id="create-err"></p>
    <div class="row end">
      <button type="button" class="btn" data-close>Cancel</button>
      <button class="btn primary">Create</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-join">
  <form class="card" id="form-join">
    <h2>Join a group</h2>
    <input name="key" placeholder="XXXX-XXXX-XXXX" required autocomplete="off" style="text-transform:uppercase">
    <p class="error" id="join-err"></p>
    <div class="row end">
      <button type="button" class="btn" data-close>Cancel</button>
      <button class="btn primary">Join</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-key">
  <div class="card">
    <h2>Access key</h2>
    <p class="muted">Share this key with the people you want to invite. <b>It is shown only once</b>, so copy it now.</p>
    <div class="keybox" id="key-value"></div>
    <div class="row end">
      <button type="button" class="btn" id="btn-copy">Copy</button>
      <button type="button" class="btn primary" data-close>Done</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-members">
  <div class="card">
    <h2>Members</h2>
    <ul class="member-list" id="member-list"></ul>
    <div id="admin-box" class="hidden">
      <hr>
      <h3>Admin</h3>
      <form id="form-regen" class="stack">
        <input name="hours" type="number" min="1" placeholder="Key expires after (hours, optional)">
        <input name="max_uses" type="number" min="1" placeholder="Max uses (optional)">
        <button class="btn">Generate new key</button>
      </form>
      <div class="keybox hidden" id="new-key"></div>
      <div class="row" style="margin-top:.6rem">
        <button type="button" class="btn" id="btn-revoke">Revoke key</button>
        <button type="button" class="btn danger" id="btn-delete">Delete group</button>
      </div>
    </div>
    <div class="row end"><button type="button" class="btn" data-close>Close</button></div>
  </div>
</dialog>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";   // no 0/O/1/I/L (32 chars)
  const DBK = "pc_db_v1", PAGE = 30;
  const bc = new BroadcastChannel("pc_chat");
  const fresh = () => ({ users: {}, groups: {}, members: [], keys: [], messages: [], seq: 1 });
  const load = () => { try { return JSON.parse(localStorage.getItem(DBK)) || fresh(); } catch { return fresh(); } };

  let db = load();
  let user = sessionStorage.getItem("pc_user");   // per TAB, so each tab can be a different user
  let cur = null, limit = PAGE, loadingMore = false, forceBottom = false;
  const online = {}, typers = {};

  // ---------- helpers ----------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;     // textContent => XSS-safe
    return e;
  }
  function toast(msg) { const t = el("div", "toast", msg); document.body.append(t); setTimeout(() => t.remove(), 3500); }
  async function sha(s) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  }
  const rand = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((x) => x.toString(16).padStart(2, "0")).join("");
  const normKey = (s) => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const fmt = (ts) => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  // Every write: reload latest data, change it, save, tell the other tabs, redraw
  function mutate(fn) {
    db = load();
    const r = fn(db);
    localStorage.setItem(DBK, JSON.stringify(db));
    bc.postMessage({ t: "sync" });
    render();
    return r;
  }

  const mem = (gid, u = user) => db.members.find((m) => m.gid === gid && m.u === u);
  const gmsgs = (gid) => db.messages.filter((m) => m.gid === gid);

  // ---------- auth ----------
  let regMode = false;
  $("#auth-toggle").onclick = (e) => {
    e.preventDefault();
    regMode = !regMode;
    $("#auth-title").textContent = regMode ? "Create account" : "Sign in";
    $("#auth-btn").textContent = regMode ? "Register" : "Sign in";
    $("#auth-toggle").textContent = regMode ? "I already have an account" : "Create an account";
    $("#auth-err").textContent = "";
  };
  $("#form-auth").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const u = f.get("u").trim().toLowerCase(), p = f.get("p");
    db = load();
    try {
      if (regMode) {
        if (!/^[a-z0-9_]{3,20}$/.test(u)) throw new Error("Username: 3-20 letters, numbers or _");
        if (db.users[u]) throw new Error("Username already taken.");
        const salt = rand(16), hash = await sha(salt + p);
        mutate((d) => { d.users[u] = { salt, hash }; });
      } else {
        const rec = db.users[u];
        if (!rec || rec.hash !== await sha(rec.salt + p)) throw new Error("Wrong username or password.");
      }
      user = u; sessionStorage.setItem("pc_user", u);
      start();
    } catch (err) { $("#auth-err").textContent = err.message; }
  };
  $("#btn-logout").onclick = () => { sessionStorage.removeItem("pc_user"); location.reload(); };

  // ---------- keys and groups ----------
  async function issueKey(gid, hours, max) {
    const plain = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => ALPHA[b % 32]).join("");
    const hash = await sha(plain);                    // only the hash is stored
    mutate((d) => {
      d.keys.filter((k) => k.gid === gid).forEach((k) => (k.active = false));
      d.keys.push({ gid, hash, exp: hours ? Date.now() + hours * 3600000 : null, max: max || null, uses: 0, active: true });
    });
    return plain.replace(/(.{4})(?=.)/g, "$1-");
  }
  function allow() {                                  // max 5 join attempts per minute
    const k = "pc_rl_" + user, now = Date.now();
    const a = JSON.parse(localStorage.getItem(k) || "[]").filter((t) => now - t < 60000);
    if (a.length >= 5) return false;
    a.push(now); localStorage.setItem(k, JSON.stringify(a));
    return true;
  }
  async function createGroup(name, desc) {
    const gid = mutate((d) => {
      const id = d.seq++;
      d.groups[id] = { id, name, desc, by: user, ts: Date.now() };
      d.members.push({ gid: id, u: user, role: "admin", lastRead: Date.now() });
      return id;
    });
    return { gid, key: await issueKey(gid) };
  }
  async function joinGroup(raw) {
    if (!allow()) throw new Error("Too many attempts. Wait a minute.");
    const hash = await sha(normKey(raw));
    const gid = mutate((d) => {
      const k = d.keys.find((x) => x.hash === hash && x.active);
      if (!k || (k.exp && k.exp < Date.now()) || (k.max && k.uses >= k.max) || !d.groups[k.gid]) return null;
      if (!d.members.some((m) => m.gid === k.gid && m.u === user)) {
        d.members.push({ gid: k.gid, u: user, role: "member", lastRead: Date.now() });
        k.uses++;
      }
      return k.gid;
    });
    if (!gid) throw new Error("Invalid or expired key.");
    return gid;
  }

  // ---------- rendering ----------
  function render() {
    if (!user) return;
    renderGroups();
    if (cur) {
      if (!mem(cur) || !db.groups[cur]) { toast("You no longer have access to this group."); closeChat(); }
      else { renderMessages(); updateSub(); }
    }
  }
  function renderGroups() {
    const ul = $("#group-list");
    ul.replaceChildren();
    const rows = db.members.filter((m) => m.u === user && db.groups[m.gid]).map((m) => {
      const list = gmsgs(m.gid), last = list[list.length - 1];
      return { m, g: db.groups[m.gid], last,
               unread: list.filter((x) => x.u !== user && x.ts > m.lastRead).length,
               ts: last ? last.ts : db.groups[m.gid].ts };
    }).sort((a, b) => b.ts - a.ts);
    if (!rows.length) ul.append(el("li", "muted pad", "No groups yet. Create one or join with a key."));
    for (const r of rows) {
      const li = el("li", "group" + (r.g.id === cur ? " active" : ""));
      li.append(el("div", "avatar", r.g.name.slice(0, 1).toUpperCase()));
      const mid = el("div", "grow");
      mid.append(el("strong", "", r.g.name),
                 el("small", "", r.last ? `${r.last.u}: ${r.last.text}` : (r.g.desc || "No messages yet")));
      li.append(mid);
      if (r.unread && r.g.id !== cur) li.append(el("span", "badge", r.unread > 99 ? "99+" : String(r.unread)));
      li.onclick = () => openGroup(r.g.id);
      ul.append(li);
    }
  }
  function msgEl(m) {
    const mine = m.u === user;
    const row = el("div", "msg " + (mine ? "mine" : "theirs"));
    const bubble = el("div", "bubble");
    if (!mine) bubble.append(el("div", "who", m.u));
    const t = el("div", "text", m.text);
    t.dir = "auto";                                   // Arabic / RTL per message
    const time = el("time", "time", fmt(m.ts));
    time.title = new Date(m.ts).toLocaleString();
    bubble.append(t, time);
    row.append(bubble);
    return row;
  }
  function renderMessages() {
    const box = $("#messages"), all = gmsgs(cur), list = all.slice(-limit);
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    const ph = box.scrollHeight, pt = box.scrollTop;
    box.replaceChildren();
    if (all.length > list.length) {
      const b = el("button", "btn sm more", "Load older messages");
      b.onclick = loadOlder;
      box.append(b);
    }
    list.forEach((m) => box.append(msgEl(m)));
    if (loadingMore) { box.scrollTop = box.scrollHeight - ph + pt; loadingMore = false; }
    else if (near || forceBottom) { box.scrollTop = box.scrollHeight; forceBottom = false; }
    else box.scrollTop = pt;
    setTimeout(markRead, 0);
  }
  function loadOlder() {
    if (loadingMore || gmsgs(cur).length <= limit) return;
    limit += PAGE; loadingMore = true; renderMessages();
  }
  $("#messages").addEventListener("scroll", (e) => { if (e.target.scrollTop < 40) loadOlder(); });

  function markRead() {                               // drives the unread counter
    if (!cur || document.hidden) return;
    const m = mem(cur), list = gmsgs(cur), last = list[list.length - 1];
    if (m && last && m.lastRead < last.ts)
      mutate((d) => { const x = d.members.find((y) => y.gid === cur && y.u === user); if (x) x.lastRead = Date.now(); });
  }
  document.addEventListener("visibilitychange", markRead);

  // ---------- presence and typing (live, not stored) ----------
  function onlineIds(gid) {
    const now = Date.now(), o = online[gid] || {};
    const s = new Set(Object.keys(o).filter((u) => now - o[u] < 10000));
    if (user && gid === cur) s.add(user);
    return s;
  }
  function updateSub() {
    if (!cur || !db.groups[cur]) return;
    const g = db.groups[cur];
    $("#chat-sub").textContent = `${onlineIds(cur).size} online` + (g.desc ? ` · ${g.desc}` : "");
  }
  function renderTyping() {
    const now = Date.now();
    const names = Object.keys(typers).filter((u) => now - typers[u] < 3000);
    $("#typing").textContent = names.length ? `${names.join(", ")} ${names.length > 1 ? "are" : "is"} typing…` : "";
  }
  bc.onmessage = (e) => {
    const d = e.data;
    if (!user) return;
    if (d.t === "sync") { db = load(); render(); }
    else if (d.t === "pres") { (online[d.g] ??= {})[d.u] = Date.now(); updateSub(); if ($("#dlg-members").open) renderMembers(); }
    else if (d.t === "bye") { if (online[d.g]) delete online[d.g][d.u]; updateSub(); }
    else if (d.t === "hello") { if (cur === d.g) bc.postMessage({ t: "pres", g: cur, u: user }); }
    else if (d.t === "typing" && d.g === cur && d.u !== user) { typers[d.u] = Date.now(); renderTyping(); setTimeout(renderTyping, 3200); }
  };
  setInterval(() => { if (user && cur) { bc.postMessage({ t: "pres", g: cur, u: user }); updateSub(); } }, 4000);
  window.addEventListener("beforeunload", () => { if (user && cur) bc.postMessage({ t: "bye", g: cur, u: user }); });

  // ---------- open / close ----------
  function openGroup(gid) {
    if (cur) bc.postMessage({ t: "bye", g: cur, u: user });
    cur = gid; limit = PAGE; forceBottom = true;
    for (const k in typers) delete typers[k];
    $("#typing").textContent = "";
    $("#empty").classList.add("hidden");
    $("#chat-inner").classList.remove("hidden");
    $("#app").classList.add("chat-open");
    $("#chat-title").textContent = db.groups[gid].name;
    bc.postMessage({ t: "pres", g: gid, u: user });
    bc.postMessage({ t: "hello", g: gid, u: user });
    render();
    $("#msg-input").focus();
  }
  function closeChat() {
    if (cur) bc.postMessage({ t: "bye", g: cur, u: user });
    cur = null;
    $("#chat-inner").classList.add("hidden");
    $("#empty").classList.remove("hidden");
    $("#app").classList.remove("chat-open");
    renderGroups();
  }
  $("#btn-back").onclick = closeChat;

  // ---------- composer ----------
  let lastTyping = 0;
  $("#msg-input").addEventListener("input", () => {
    const n = Date.now();
    if (cur && n - lastTyping > 2000) { bc.postMessage({ t: "typing", g: cur, u: user }); lastTyping = n; }
  });
  $("#composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("#msg-input"), text = input.value.trim().slice(0, 2000);
    if (!text || !cur || !mem(cur)) return;           // membership checked on every send
    forceBottom = true;
    mutate((d) => {
      d.messages.push({ id: d.seq++, gid: cur, u: user, text, ts: Date.now() });
      const x = d.members.find((y) => y.gid === cur && y.u === user);
      if (x) x.lastRead = Date.now();
    });
    input.value = "";
  });

  // ---------- dialogs ----------
  document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));
  function showKey(key) { $("#key-value").textContent = key; $("#dlg-key").showModal(); }
  $("#btn-copy").onclick = () => navigator.clipboard.writeText($("#key-value").textContent).then(() => toast("Copied"));

  $("#btn-create").onclick = () => { $("#form-create").reset(); $("#create-err").textContent = ""; $("#dlg-create").showModal(); };
  $("#form-create").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target), name = f.get("name").trim();
    if (!name) { $("#create-err").textContent = "Group name is required."; return; }
    const { gid, key } = await createGroup(name, f.get("description").trim());
    $("#dlg-create").close();
    showKey(key);
    openGroup(gid);
  };
  $("#btn-join").onclick = () => { $("#form-join").reset(); $("#join-err").textContent = ""; $("#dlg-join").showModal(); };
  $("#form-join").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const gid = await joinGroup(new FormData(e.target).get("key"));
      $("#dlg-join").close();
      openGroup(gid);
    } catch (err) { $("#join-err").textContent = err.message; }
  };

  // ---------- members + admin ----------
  function renderMembers() {
    const ul = $("#member-list"), isAdmin = mem(cur) && mem(cur).role === "admin", on = onlineIds(cur);
    ul.replaceChildren();
    for (const m of db.members.filter((x) => x.gid === cur)) {
      const li = el("li", "member");
      li.append(el("span", "dot" + (on.has(m.u) ? " on" : "")),
                el("span", "grow", m.u + (m.u === user ? " (you)" : "")),
                el("small", "muted", m.role));
      if (isAdmin && m.u !== user) {
        const b = el("button", "btn danger sm", "Remove");
        b.type = "button";
        b.onclick = () => {
          if (!confirm(`Remove ${m.u}?`)) return;
          mutate((d) => { d.members = d.members.filter((x) => !(x.gid === cur && x.u === m.u)); });
          renderMembers();
        };
        li.append(b);
      }
      ul.append(li);
    }
  }
  $("#btn-members").onclick = () => {
    renderMembers();
    $("#admin-box").classList.toggle("hidden", !(mem(cur) && mem(cur).role === "admin"));
    $("#new-key").classList.add("hidden");
    $("#dlg-members").showModal();
  };
  $("#form-regen").onsubmit = async (e) => {
    e.preventDefault();
    if (!mem(cur) || mem(cur).role !== "admin") return;
    const f = new FormData(e.target);
    const key = await issueKey(cur, parseInt(f.get("hours")) || null, parseInt(f.get("max_uses")) || null);
    const box = $("#new-key"); box.textContent = key; box.classList.remove("hidden");
  };
  $("#btn-revoke").onclick = () => {
    if (!confirm("Revoke the current key? Nobody can join until you generate a new one.")) return;
    mutate((d) => d.keys.filter((k) => k.gid === cur).forEach((k) => (k.active = false)));
    toast("Key revoked");
  };
  $("#btn-delete").onclick = () => {
    if (!confirm("Delete this group and all its messages? This cannot be undone.")) return;
    const gid = cur;
    $("#dlg-members").close();
    mutate((d) => {
      delete d.groups[gid];
      d.members = d.members.filter((x) => x.gid !== gid);
      d.keys = d.keys.filter((x) => x.gid !== gid);
      d.messages = d.messages.filter((x) => x.gid !== gid);
    });
  };

  // ---------- misc UI ----------
  $("#btn-theme").onclick = () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t; localStorage.setItem("theme", t);
  };
  $("#btn-dir").onclick = () => {
    const d = document.documentElement.dir === "rtl" ? "ltr" : "rtl";
    document.documentElement.dir = d; localStorage.setItem("dir", d);
  };

  // ---------- start ----------
  function start() {
    $("#auth").classList.add("hidden");
    $("#app").classList.remove("hidden");
    $("#me-name").textContent = "@" + user;
    db = load();
    render();
  }
  if (user && db.users[user]) start();
  else { sessionStorage.removeItem("pc_user"); user = null; }
})();
</script>
</body>
</html>
